<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
</head>
<body class="{{ block "body-class" . }}page-default{{ end }}">

  {{ partial "nav-vectors.html" (dict "mode" "top" "page" .) }}

  {{ block "main" . }}
  {{ end }}

  {{ if not .IsHome }}
    {{ partial "nav-vectors.html" (dict "mode" "bottom" "page" .) }}
  {{ end }}

</body>
</html>
