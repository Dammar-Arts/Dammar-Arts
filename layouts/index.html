<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "fr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>

  <!-- Top Anchor: D A M M A R with unsealing carbon sheet -->
  <header class="masthead">
    <div class="drawer-trigger" tabindex="0">
      <span class="wordmark">D A M M A R</span>
      <div class="folded-sheet" role="region" aria-label="Archive Data">
        <div class="sheet-title">{{ .Site.Title }}</div>
        <div class="sheet-data">
          <div>LOC: {{ .Site.Params.location }}</div>
          <div>GEO: {{ .Site.Params.coordinates }}</div>
          <div>NET: <a href="mailto:{{ .Site.Params.contact_email }}">{{ .Site.Params.contact_email }}</a></div>
        </div>
      </div>
    </div>
  </header>

  <main class="prism-canvas">
    <a href="{{ "script/" | relURL }}" class="facet facet-script">
      <span class="facet-marker">01 / SCRIPT</span>
    </a>

    <a href="{{ "pigment/" | relURL }}" class="facet facet-pigment">
      <span class="facet-marker">02 / PIGMENT</span>
    </a>

    <a href="{{ "objects/" | relURL }}" class="facet facet-objects">
      <span class="facet-marker">03 / OBJECTS</span>
    </a>
  </main>

</body>
</html>
